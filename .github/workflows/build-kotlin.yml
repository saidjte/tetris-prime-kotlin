name: Build Kotlin APK

on:
  push:
    branches: [main]
    paths:
      - 'kotlin-src/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotlin-src

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.2'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Sign Release APK
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY_BASE64 }}
          alias: tetris-prime
          keyStorePassword: android
          keyPassword: android
        env:
          BUILD_TOOLS_VERSION: '34.0.0'

      - name: Rename APK
        run: |
          VERSION=$(grep versionName ../version.txt 2>/dev/null | cut -d= -f2 || echo "1.0.0")
          find app/build/outputs/apk -name "*.apk" -exec cp {} tetris-prime-kotlin-${VERSION}.apk \;
          ls -la tetris-prime-kotlin-*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tetris-prime-kotlin-apk
          path: kotlin-src/tetris-prime-kotlin-*.apk
          retention-days: 30

      - name: Upload source archive
        run: |
          cd ..
          git archive --format=zip --prefix=tetris-prime-kotlin/ HEAD -o kotlin-src/tetris-prime-kotlin-src.zip

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: tetris-prime-kotlin-src
          path: kotlin-src/tetris-prime-kotlin-src.zip
          retention-days: 30
