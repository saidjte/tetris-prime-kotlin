name: Build Kotlin APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore keystore
        # Prefer secret-stored keystore (secure, recoverable); fall back to repo copy
        # so first build after this change works even if secrets aren't set yet.
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "Using keystore from GitHub Actions secret SIGNING_KEYSTORE_BASE64"
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > debug.keystore
            echo "Keystore restored: $(stat -c%s debug.keystore) bytes"
          elif [ -f debug.keystore ]; then
            echo "Using keystore from repo (fallback)"
          else
            echo "ERROR: no keystore available. Set SIGNING_KEYSTORE_BASE64 secret or commit debug.keystore"
            exit 1
          fi

      - name: Build Release APK (signed)
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          VERSION="1.11.0"
          find app/build/outputs/apk -name "*.apk" | head -1 | xargs -I{} cp {} tetris-prime-kotlin-${VERSION}.apk
          ls -la tetris-prime-kotlin-*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tetris-prime-kotlin-apk
          path: tetris-prime-kotlin-*.apk
          retention-days: 30

      - name: Upload source archive
        run: |
          git archive --format=zip --prefix=tetris-prime-kotlin/ HEAD -o tetris-prime-kotlin-src.zip

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: tetris-prime-kotlin-src
          path: tetris-prime-kotlin-src.zip
          retention-days: 30
