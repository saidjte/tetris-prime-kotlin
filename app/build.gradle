plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Signing config — uses debug.keystore for consistent updates.
// Credentials can be overridden by env vars (CI uses GitHub Actions secrets).
// If env vars are absent, falls back to the literal defaults used historically.
def keystoreFile = rootProject.file("debug.keystore")

android {
    namespace 'com.tetrisprime.kotlin'
    compileSdk 34

    defaultConfig {
        applicationId "com.tetrisprime.kotlin"
        minSdk 26
        targetSdk 34
        versionCode 10
        versionName "1.8.0"
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv('SIGNING_KEYSTORE_PASSWORD') ?: 'android'
                keyAlias   System.getenv('SIGNING_KEY_ALIAS')         ?: 'tetris-prime'
                keyPassword System.getenv('SIGNING_KEY_PASSWORD')     ?: 'android'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
